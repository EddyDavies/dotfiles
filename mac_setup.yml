---
- name: Setup New Mac Environment
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    dotfiles_dir: "{{ lookup('env','HOME') }}/dotfiles"

  tasks:
    - name: Install Homebrew
      shell: |
        which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

    - name: Install Homebrew packages from Brewfile
      shell: brew bundle --file={{ dotfiles_dir }}/configs/Brewfile
      environment:
        HOMEBREW_NO_AUTO_UPDATE: 1

    - name: Copy git config
      copy:
        src: "{{ dotfiles_dir }}/configs/gitconfig"
        dest: "~/.gitconfig"
        backup: yes

    - name: Copy Zsh config
      copy:
        src: "{{ dotfiles_dir }}/configs/zshrc"
        dest: "~/.zshrc"
        backup: yes

    - name: Ensure ~/.config directory exists
      file:
        path: "~/.config"
        state: directory
        mode: '0755'

    - name: Copy Starship config
      copy:
        src: "{{ dotfiles_dir }}/configs/starship.toml"
        dest: "~/.config/starship.toml"
        backup: yes

    - name: Restore Raycast configuration
      shell: |
        if [ -d "{{ dotfiles_dir }}/configs/raycast" ]; then
          mkdir -p "$HOME/Library/Application Support/com.raycast.macos"
          rsync -av --exclude='*.log' --exclude='cache/' --exclude='tmp/' \
                "{{ dotfiles_dir }}/configs/raycast/" \
                "$HOME/Library/Application Support/com.raycast.macos/"
        fi
      ignore_errors: yes

    - name: Ensure ~/.config/karabiner directory exists
      file:
        path: "~/.config/karabiner"
        state: directory
        mode: '0755'

    - name: Restore Karabiner-Elements config
      copy:
        src: "{{ dotfiles_dir }}/configs/karabiner.json"
        dest: "~/.config/karabiner/karabiner.json"
        backup: yes

    - name: Restore VSCode user settings
      shell: |
        if [ -d "{{ dotfiles_dir }}/configs/vscode-settings" ]; then
          mkdir -p "$HOME/Library/Application Support/Code/User"
          rsync -av "{{ dotfiles_dir }}/configs/vscode-settings/" \
                "$HOME/Library/Application Support/Code/User/"
        fi
      ignore_errors: yes

    - name: Import keyboard shortcuts
      shell: |
        defaults import com.apple.symbolichotkeys {{ dotfiles_dir }}/configs/symbolichotkeys.plist

    - name: Create Downloads directory for manual apps
      file:
        path: "~/Downloads/manual_apps"
        state: directory

    # Microsoft Office, Zoom and ChatGPT are installed via Homebrew casks
    # (see configs/Brewfile) — no manual download needed.

    - name: Download Pinokio
      get_url:
        url: "https://github.com/pinokiocomputer/pinokio/releases/latest/download/Pinokio-darwin-arm64.zip"
        dest: "~/Downloads/manual_apps/Pinokio-darwin-arm64.zip"
        mode: '0644'

    - name: Download Willow
      get_url:
        url: "https://willow-mac-download.s3.amazonaws.com/latest/Willow.Installer.dmg"
        dest: "~/Downloads/manual_apps/Willow.Installer.dmg"
        mode: '0644'

    - name: Display manual installation message
      debug:
        msg: |
          Downloaded apps are in ~/Downloads/manual_apps/
          Please manually install (no Homebrew cask available):
          - Pinokio (.zip)
          - Willow (.dmg)

          Everything else (Office, Zoom, ChatGPT, Zen Browser, …) installs
          via Homebrew casks — see configs/Brewfile.