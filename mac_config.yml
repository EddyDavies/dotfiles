---
- name: complete macOS setup
  hosts: localhost
  gather_facts: false

  vars:
    # replace with your keyboard vendor-product ID:
    # Run this to discover the right value:
    #   defaults -currentHost read -g | grep modifiermapping
    keyboard_vid_pid: "1452-579"

    brew_bin: "/opt/homebrew/bin/brew"
    dock_tile_size: 36
    dock_large_size: 128

  tasks:
    ####################################################################
    # FN KEY — disable dictation only
    ####################################################################
    - name: disable dictation triggered by fn key
      community.general.osx_defaults:
        domain: com.apple.HIToolbox
        key: AppleDictationAutoEnable
        type: int
        value: 0

    ####################################################################
    # DISABLE SPOTLIGHT (CMD + SPACE)
    ####################################################################
    - name: disable spotlight cmd+space
      ansible.builtin.command:
        argv:
          - defaults
          - write
          - com.apple.symbolichotkeys
          - AppleSymbolicHotKeys
          - -dict-add
          - "64"
          - >-
            <dict>
              <key>enabled</key><false/>
              <key>value</key>
              <dict>
                <key>type</key><string>standard</string>
                <key>parameters</key>
                <array>
                  <integer>32</integer>
                  <integer>49</integer>
                  <integer>1048576</integer>
                </array>
              </dict>
            </dict>

    - name: apply keyboard shortcut changes immediately
      ansible.builtin.command: >
        /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u

    ####################################################################
    # APP SHORTCUTS (System Settings > Keyboard > App Shortcuts)
    # Global menu-item rebinds stored in NSUserKeyEquivalents.
    # Captured from live state; keep in sync via update_from_local/sync.sh.
    # Modifier glyphs: @ = ⌘, ~ = ⌥, ^ = ⌃, $ = ⇧.
    ####################################################################
    - name: rebind global menu shortcuts (NSUserKeyEquivalents)
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSUserKeyEquivalents
        type: dict
        value:
          "Enter Full Screen": "@~^$0"   # ⌘⌥⌃⇧0 — frees plain ⌘⏎/⌃⌘F
          "Enter Fullscreen": "@~^$p"
          "Fill": "@~^$l"
          "Minimise": "@~$0"
          "Minimize": "@~$0"
          "Toggle Full Screen": "@~^$i"

    ####################################################################
    # KEYBOARD — fast key repeat
    ####################################################################
    - name: fast key repeat rate
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: KeyRepeat
        type: int
        value: 2

    - name: short delay until repeat
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: InitialKeyRepeat
        type: int
        value: 15

    ####################################################################
    # TRACKPAD — tap to click
    ####################################################################
    - name: enable tap-to-click (NSGlobalDomain)
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.mouse.tapBehavior
        type: int
        value: 1

    - name: enable tap-to-click (built-in trackpad)
      community.general.osx_defaults:
        domain: com.apple.AppleMultitouchTrackpad
        key: Clicking
        type: bool
        value: true

    - name: enable tap-to-click (bluetooth trackpad)
      community.general.osx_defaults:
        domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
        key: Clicking
        type: bool
        value: true

    ####################################################################
    # FINDER — show all file extensions
    ####################################################################
    - name: show all file extensions
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleShowAllExtensions
        type: bool
        value: true

    ####################################################################
    # SCREENSHOTS — save to ~/Downloads
    ####################################################################
    - name: ensure ~/Downloads exists for screenshots
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/Downloads"
        state: directory
        mode: "0755"

    - name: save screenshots to ~/Downloads
      community.general.osx_defaults:
        domain: com.apple.screencapture
        key: location
        type: string
        value: "{{ lookup('env','HOME') }}/Downloads"

    - name: restart SystemUIServer so screenshot location takes effect
      ansible.builtin.command: killall SystemUIServer
      ignore_errors: true

    ####################################################################
    # DOCK BEHAVIOUR
    ####################################################################
    - name: dock autohide
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: true

    - name: dock magnification
      community.general.osx_defaults:
        domain: com.apple.dock
        key: magnification
        type: bool
        value: true

    - name: dock base icon size
      community.general.osx_defaults:
        domain: com.apple.dock
        key: tilesize
        type: int
        value: "{{ dock_tile_size }}"

    - name: dock magnified icon size
      community.general.osx_defaults:
        domain: com.apple.dock
        key: largesize
        type: int
        value: "{{ dock_large_size }}"

    - name: use scale minimise effect
      community.general.osx_defaults:
        domain: com.apple.dock
        key: mineffect
        type: string
        value: scale

    ####################################################################
    # DOCK CONTENTS — Notes, Messages (Finder is always there by default)
    ####################################################################
    - name: set dock items (notes, messages)
      ansible.builtin.shell: |
        dock_item () {
          printf '<dict><key>tile-data</key><dict><key>file-data</key><dict><key>_CFURLString</key><string>%s</string><key>_CFURLStringType</key><integer>0</integer></dict></dict><key>tile-type</key><string>file-tile</string></dict>' "$1"
        }

        defaults delete com.apple.dock persistent-apps 2>/dev/null || true

        notes=$(dock_item "/System/Applications/Notes.app")
        messages=$(dock_item "/System/Applications/Messages.app")

        defaults write com.apple.dock persistent-apps -array "$notes" "$messages"
      args:
        executable: /bin/bash

    ####################################################################
    # HOT CORNERS — disable all four (corner + modifier for each)
    ####################################################################
    - name: disable all hot corners
      community.general.osx_defaults:
        domain: com.apple.dock
        key: "{{ item }}"
        type: int
        value: 0
      loop:
        - wvous-tl-corner
        - wvous-tl-modifier
        - wvous-tr-corner
        - wvous-tr-modifier
        - wvous-bl-corner
        - wvous-bl-modifier
        - wvous-br-corner
        - wvous-br-modifier

    ####################################################################
    # MISSION CONTROL — app exposé gesture
    ####################################################################
    - name: enable app exposé three-finger gesture
      community.general.osx_defaults:
        domain: com.apple.dock
        key: showAppExposeGestureEnabled
        type: bool
        value: true

    ####################################################################
    # FINDER TOOLBAR — include delete/trash icon
    ####################################################################
    - name: add trash/delete icon to finder toolbar
      ansible.builtin.command: >
        defaults write com.apple.finder 'NSToolbar Configuration Browser'
        '{ "TB Display Mode" = 2;
           "TB Icon Size Mode" = 1;
           "TB Is Shown" = 1;
           "TB Item Identifiers" = (
              "com.apple.finder.BACK",
              NSToolbarFlexibleSpaceItem,
              "com.apple.finder.SWCH",
              NSToolbarSpaceItem,
              "com.apple.finder.QUIK",
              "com.apple.finder.ACTN",
              NSToolbarFlexibleSpaceItem,
              "com.apple.finder.INFO",
              "com.apple.finder.TRSH",
              "com.apple.finder.NFLD",
              "com.apple.finder.BURN",
              "com.apple.finder.EJCT",
              NSToolbarFlexibleSpaceItem,
              "com.apple.finder.SRCH"
           );
           "TB Size Mode" = 1;
           "TB Visibility Priority Values" = { };
        }'

    ####################################################################
    # ~/code folder
    ####################################################################
    - name: ensure ~/code exists
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/code"
        state: directory
        mode: "0755"

    ####################################################################
    # RESTART FINDER & DOCK
    ####################################################################
    - name: restart finder
      ansible.builtin.command: killall Finder
      ignore_errors: true

    - name: restart dock
      ansible.builtin.command: killall Dock
      ignore_errors: true
